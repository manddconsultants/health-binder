<style>
/* Layout: one-column phone app, sticky title bar, fixed bottom tab bar, cards only for records */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --ink: #16212a;
  --muted: #5b6b77;
  --line: #d5dde3;
  --accent: #0b6b68;
  --accent-soft: #d8ecea;
  --warn: #9a5a00;
  --warn-soft: #fbedd6;
  --bad: #b3261e;
  --bad-soft: #f9dedc;
  --good: #2b7a4b;
  --good-soft: #dcefe3;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1619; --surface: #182226; --ink: #e6edf0; --muted: #98a8b2; --line: #2a373d;
    --accent: #5cc2bb; --accent-soft: #173533; --warn: #f0b45a; --warn-soft: #3a2b12;
    --bad: #f2867d; --bad-soft: #3d1c1a; --good: #7dcf9c; --good-soft: #17301f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1619; --surface: #182226; --ink: #e6edf0; --muted: #98a8b2; --line: #2a373d;
  --accent: #5cc2bb; --accent-soft: #173533; --warn: #f0b45a; --warn-soft: #3a2b12;
  --bad: #f2867d; --bad-soft: #3d1c1a; --good: #7dcf9c; --good-soft: #17301f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; text-wrap: balance; }
.add-btn { background: var(--accent); color: var(--surface); border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 700; }
.add-btn[hidden] { display: none !important; }

main { padding-block: 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.view { display: grid; gap: 20px; }
.section { display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0; }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.card.tap { cursor: pointer; text-align: left; width: 100%; }
.card-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-title { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
.note { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.95rem; border-left: 3px solid var(--line); padding-left: 10px; }
.note-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.date-block { flex: none; text-align: center; min-width: 52px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); padding: 6px 4px; font-variant-numeric: tabular-nums; }
.date-block .d { font-family: var(--font-display); font-size: 1.4rem; line-height: 1; display: block; }
.date-block .m { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.date-block.past { background: var(--bg); color: var(--muted); }
.grow { flex: 1; min-width: 0; display: grid; gap: 4px; }

.chip { flex: none; display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--bg); color: var(--muted); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.small-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.9rem; font-weight: 700; }
.small-btn.primary { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px 16px; display: grid; gap: 8px; color: var(--muted); }
.empty strong { color: var(--ink); }
.example { opacity: 0.75; }
.example-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); }

.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; text-align: left; }
.stat .n { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.82rem; color: var(--muted); }
.stat.alert .n { color: var(--warn); }

.status-line { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--good); }
.dot.local { background: var(--warn); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
nav.tabs button { background: none; border: 0; display: grid; place-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 0.75rem; font-weight: 700; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(10, 20, 25, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.field { display: grid; gap: 5px; }
.field label { font-weight: 700; font-size: 0.92rem; }
.field .hint { font-size: 0.82rem; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; min-width: 0; }
.field textarea { min-height: 96px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row > * { min-width: 0; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.check input { width: 22px; height: 22px; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.btn { border-radius: 999px; padding: 10px 18px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); background: var(--bad-soft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.92rem; max-width: calc(100% - 32px); }
.tool-list { display: grid; gap: 8px; }
.tool-list .btn { text-align: left; }
.filter { display: flex; gap: 6px; flex-wrap: wrap; }
.filter button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.88rem; font-weight: 700; color: var(--muted); }
.filter button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 380px) { .summary-grid { grid-template-columns: 1fr 1fr; } .field-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <h1 id="view-title">Overview</h1>
  <button class="add-btn" id="add-btn" type="button" hidden>+ Add</button>
</div></header>

<main class="wrap" id="main" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections"><div class="inner">
  <button type="button" data-tab="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
  <button type="button" data-tab="appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Appointments</button>
  <button type="button" data-tab="medications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M8.5 8.5l7 7"/></svg>Medications</button>
  <button type="button" data-tab="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Health</button>
</div></nav>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
(function () {
  "use strict";

  // ---------- small helpers ----------
  const $ = (sel, el) => (el || document).querySelector(sel);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const toISO = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const todayISO = () => toISO(new Date());
  function parseISO(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function daysUntil(iso) {
    const d = parseISO(iso); if (!d) return null;
    const t = parseISO(todayISO());
    return Math.round((d - t) / 86400000);
  }
  function fmtDate(iso, opts) {
    const d = parseISO(iso); if (!d) return "";
    return d.toLocaleDateString(undefined, opts || { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  function fmtTime(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function relDays(n) {
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    return n > 0 ? "In " + n + " days" : Math.abs(n) + " days ago";
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function toast(msg) {
    const root = $("#toast-root");
    root.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>";
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { root.innerHTML = ""; }, 2600);
  }

  // ---------- data ----------
  const KINDS = ["appointments", "medications", "issues"];
  const state = { appointments: {}, medications: {}, issues: {} };

  // Everything is kept in this device's own storage and never sent anywhere.
  const LS_KEY = "health-binder-v1";
  const BACKUP_KEY = "health-binder-last-backup";
  let storageOk = true;
  function lsRead() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { storageOk = false; return null; }
  }
  function lsWrite() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) { storageOk = false; toast("Couldn't save on this device. Save a backup file now."); }
  }
  function lastBackup() { try { return localStorage.getItem(BACKUP_KEY) || ""; } catch (e) { return ""; } }
  function setLastBackup() { try { localStorage.setItem(BACKUP_KEY, todayISO()); } catch (e) { /* ignore */ } }

  function saveItem(kind, id, data) {
    data.updated = new Date().toISOString();
    state[kind] = Object.assign({}, state[kind], { [id]: data });
    lsWrite();
    render();
  }
  function removeItem(kind, id) {
    const next = Object.assign({}, state[kind]); delete next[id]; state[kind] = next;
    lsWrite();
    render();
  }
  const list = (kind) => Object.entries(state[kind]).map(([id, v]) => Object.assign({ id }, v));

  // ---------- derived ----------
  function apptsUpcoming() {
    const t = todayISO();
    return list("appointments").filter((a) => (a.date || "") >= t)
      .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  }
  function apptsPast() {
    const t = todayISO();
    return list("appointments").filter((a) => a.date && a.date < t)
      .sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
  }
  function medStatus(m) {
    if (m.active === false) return { cls: "", text: "Stopped", rank: 9 };
    const n = daysUntil(m.nextDue);
    if (n == null) return { cls: "", text: "No refill date", rank: 5 };
    if (n < 0) return { cls: "bad", text: "Overdue " + Math.abs(n) + (Math.abs(n) === 1 ? " day" : " days"), rank: 0 };
    if (n <= 7) return { cls: "warn", text: n === 0 ? "Refill today" : "Refill in " + n + (n === 1 ? " day" : " days"), rank: 1 };
    return { cls: "good", text: "Refill " + fmtDate(m.nextDue, { day: "numeric", month: "short" }), rank: 2 };
  }
  const repeatsLeft = (m) => (m.repeats === "" || m.repeats == null || isNaN(Number(m.repeats))) ? null : Number(m.repeats);
  function medsSorted() {
    return list("medications").sort((a, b) => {
      const sa = medStatus(a), sb = medStatus(b);
      if (sa.rank !== sb.rank) return sa.rank - sb.rank;
      return (a.nextDue || "9999").localeCompare(b.nextDue || "9999") || (a.name || "").localeCompare(b.name || "");
    });
  }
  const ISSUE_STATUS = {
    current: { label: "Being treated", cls: "accent" },
    monitoring: { label: "Monitoring", cls: "good" },
    future: { label: "To raise later", cls: "warn" },
    resolved: { label: "Resolved", cls: "" },
  };
  const issueName = (id) => (state.issues[id] && state.issues[id].name) || "";

  // ---------- views ----------
  const TITLES = { overview: "Overview", appointments: "Appointments", medications: "Medications", health: "Health issues" };
  const TABS = Object.keys(TITLES);
  let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
  let apptFilter = "upcoming";
  let deleteArmed = false;

  function apptCard(a, opts) {
    const n = daysUntil(a.date);
    const past = n != null && n < 0;
    const d = parseISO(a.date);
    const dateBlock = d
      ? '<div class="date-block' + (past ? " past" : "") + '"><span class="d">' + d.getDate() + '</span><span class="m">' + esc(d.toLocaleDateString(undefined, { month: "short" })) + "</span></div>"
      : '<div class="date-block"><span class="m">No date</span></div>';
    const chips = [];
    if (n != null && n >= 0 && n <= 14) chips.push('<span class="chip ' + (n <= 1 ? "warn" : "accent") + '">' + relDays(n) + "</span>");
    if (past && !a.after) chips.push('<span class="chip warn">Add notes from visit</span>');
    if (a.issueId && issueName(a.issueId)) chips.push('<span class="chip">' + esc(issueName(a.issueId)) + "</span>");
    const metaBits = [fmtDate(a.date), fmtTime(a.time), a.place].filter(Boolean).map(esc).join(" · ");
    const notes = [];
    if (a.before && (!past || (opts && opts.full))) notes.push('<div><div class="note-label">Before: questions and things to mention</div><div class="note">' + esc(a.before) + "</div></div>");
    if (a.after) notes.push('<div><div class="note-label">After: what was said and next steps</div><div class="note">' + esc(a.after) + "</div></div>");
    return '<article class="card' + (opts && opts.example ? " example" : "") + '">' +
      (opts && opts.example ? '<span class="example-tag">Example</span>' : "") +
      '<div class="card-row">' + dateBlock +
      '<div class="grow"><div class="card-title">' + esc(a.who || "Appointment") + (a.kind ? ' <span class="meta">· ' + esc(a.kind) + "</span>" : "") + "</div>" +
      '<div class="meta">' + metaBits + "</div>" +
      (a.reason ? '<div class="meta">For: ' + esc(a.reason) + "</div>" : "") +
      "</div></div>" +
      (chips.length ? '<div class="chips">' + chips.join("") + "</div>" : "") +
      notes.join("") +
      (opts && opts.example ? "" : '<div class="card-actions">' +
        (past ? '<button class="small-btn primary" data-act="edit" data-kind="appointments" data-id="' + esc(a.id) + '" data-focus="after">' + (a.after ? "Edit visit notes" : "Add visit notes") + "</button>"
              : '<button class="small-btn primary" data-act="edit" data-kind="appointments" data-id="' + esc(a.id) + '" data-focus="before">' + (a.before ? "Edit questions" : "Add questions") + "</button>") +
        '<button class="small-btn" data-act="edit" data-kind="appointments" data-id="' + esc(a.id) + '">Edit</button></div>') +
      "</article>";
  }

  function medCard(m, opts) {
    const st = medStatus(m);
    const reps = repeatsLeft(m);
    const chips = ['<span class="chip ' + st.cls + '">' + esc(st.text) + "</span>"];
    if (m.active !== false && reps != null) chips.push(reps === 0 ? '<span class="chip bad">No repeats left: ask for a new script</span>' : '<span class="chip">' + reps + (reps === 1 ? " repeat" : " repeats") + " left</span>");
    if (m.issueId && issueName(m.issueId)) chips.push('<span class="chip">' + esc(issueName(m.issueId)) + "</span>");
    const metaBits = [m.dose, m.schedule].filter(Boolean).map(esc).join(" · ");
    return '<article class="card' + (opts && opts.example ? " example" : "") + '">' +
      (opts && opts.example ? '<span class="example-tag">Example</span>' : "") +
      '<div class="grow"><div class="card-title">' + esc(m.name || "Medication") + "</div>" +
      (metaBits ? '<div class="meta">' + metaBits + "</div>" : "") +
      (m.prescriber ? '<div class="meta">Prescribed by ' + esc(m.prescriber) + "</div>" : "") +
      (m.lastFilled ? '<div class="meta">Last filled ' + esc(fmtDate(m.lastFilled, { day: "numeric", month: "short", year: "numeric" })) + "</div>" : "") +
      "</div>" +
      '<div class="chips">' + chips.join("") + "</div>" +
      (m.notes ? '<div class="note">' + esc(m.notes) + "</div>" : "") +
      (opts && opts.example ? "" : '<div class="card-actions">' +
        (m.active !== false ? '<button class="small-btn primary" data-act="refilled" data-id="' + esc(m.id) + '">Mark as filled today</button>' : "") +
        '<button class="small-btn" data-act="edit" data-kind="medications" data-id="' + esc(m.id) + '">Edit</button></div>') +
      "</article>";
  }

  function issueCard(i, opts) {
    const s = ISSUE_STATUS[i.status] || ISSUE_STATUS.current;
    const linkedMeds = list("medications").filter((m) => m.issueId === i.id && m.active !== false).map((m) => m.name);
    const nextAppt = apptsUpcoming().find((a) => a.issueId === i.id);
    const metaBits = [i.treatedBy ? "With " + i.treatedBy : "", i.since ? "Since " + i.since : ""].filter(Boolean).map(esc).join(" · ");
    return '<article class="card' + (opts && opts.example ? " example" : "") + '">' +
      (opts && opts.example ? '<span class="example-tag">Example</span>' : "") +
      '<div class="card-row"><div class="card-title">' + esc(i.name || "Health issue") + '</div><span class="chip ' + s.cls + '">' + s.label + "</span></div>" +
      (metaBits ? '<div class="meta">' + metaBits + "</div>" : "") +
      (linkedMeds.length ? '<div class="meta">Medications: ' + esc(linkedMeds.join(", ")) + "</div>" : "") +
      (nextAppt ? '<div class="meta">Next appointment: ' + esc(fmtDate(nextAppt.date, { day: "numeric", month: "short" })) + " with " + esc(nextAppt.who || "") + "</div>" : "") +
      (i.notes ? '<div class="note">' + esc(i.notes) + "</div>" : "") +
      (opts && opts.example ? "" : '<div class="card-actions"><button class="small-btn" data-act="edit" data-kind="issues" data-id="' + esc(i.id) + '">Edit</button></div>') +
      "</article>";
  }

  const EXAMPLES = {
    appointments: { who: "Dr Patel", kind: "GP", date: addDays(todayISO(), 3), time: "10:30", place: "Main St Medical Centre", before: "Ask whether the new dose is working\nMention the knee pain on stairs" },
    medications: { name: "Atorvastatin", dose: "20 mg", schedule: "1 tablet at night", prescriber: "Dr Patel", nextDue: addDays(todayISO(), 5), repeats: 2 },
    issues: { name: "High cholesterol", status: "current", treatedBy: "Dr Patel", notes: "Recheck bloods in March" },
  };
  function emptyState(kind, what, how) {
    const card = kind === "appointments" ? apptCard(EXAMPLES.appointments, { example: true })
      : kind === "medications" ? medCard(EXAMPLES.medications, { example: true })
      : issueCard(EXAMPLES.issues, { example: true });
    return '<div class="empty"><strong>' + esc(what) + "</strong><span>" + esc(how) + '</span><button class="small-btn primary" style="justify-self:start" data-act="new" data-kind="' + kind + '">+ Add your first</button></div>' + card;
  }

  function viewOverview() {
    const up = apptsUpcoming();
    const meds = list("medications").filter((m) => m.active !== false);
    const dueSoon = meds.filter((m) => { const n = daysUntil(m.nextDue); return n != null && n <= 14; })
      .sort((a, b) => (a.nextDue || "").localeCompare(b.nextDue || ""));
    const noRepeats = meds.filter((m) => repeatsLeft(m) === 0);
    const current = list("issues").filter((i) => i.status === "current" || !i.status);
    const future = list("issues").filter((i) => i.status === "future");
    const needNotes = apptsPast().filter((a) => !a.after && daysUntil(a.date) >= -14);
    const isEmpty = !list("appointments").length && !meds.length && !list("issues").length;

    let h = '<div class="summary-grid">' +
      '<button class="stat" data-go="appointments"><span class="n">' + up.length + '</span><span class="l">Upcoming appointments</span></button>' +
      '<button class="stat' + (dueSoon.length ? " alert" : "") + '" data-go="medications"><span class="n">' + dueSoon.length + '</span><span class="l">Refills due in 2 weeks</span></button>' +
      '<button class="stat" data-go="health"><span class="n">' + current.length + '</span><span class="l">Issues being treated</span></button>' +
      "</div>";

    if (isEmpty) {
      h += '<div class="empty"><strong>Start with what is coming up next.</strong><span>Add your next appointment, the medications you take, and the health issues you are dealing with. Everything here comes from what you enter.</span>' +
        '<div class="card-actions"><button class="small-btn primary" data-act="new" data-kind="appointments">+ Appointment</button><button class="small-btn primary" data-act="new" data-kind="medications">+ Medication</button><button class="small-btn primary" data-act="new" data-kind="issues">+ Health issue</button></div></div>';
    }

    h += '<section class="section"><div class="section-head"><p class="eyebrow">Next appointment</p>' + (up.length > 1 ? '<button class="link-btn" data-go="appointments">See all</button>' : "") + "</div>";
    h += up.length ? apptCard(up[0]) : '<div class="empty">No upcoming appointments. <button class="link-btn" style="justify-self:start" data-act="new" data-kind="appointments">+ Add one</button></div>';
    h += "</section>";

    if (needNotes.length) {
      h += '<section class="section"><p class="eyebrow">Write up while it is fresh</p>' + needNotes.map((a) => apptCard(a)).join("") + "</section>";
    }

    h += '<section class="section"><div class="section-head"><p class="eyebrow">Scripts to fill soon</p><button class="link-btn" data-go="medications">All medications</button></div>';
    h += dueSoon.length ? dueSoon.map((m) => medCard(m)).join("") : '<div class="empty">Nothing due in the next two weeks.</div>';
    if (noRepeats.length) h += '<div class="card"><div class="card-title">Ask for new scripts</div><div class="meta">No repeats left on: ' + esc(noRepeats.map((m) => m.name).join(", ")) + ". Bring this up at your next appointment.</div></div>";
    h += "</section>";

    if (future.length) {
      h += '<section class="section"><div class="section-head"><p class="eyebrow">Things to raise later</p><button class="link-btn" data-go="health">All issues</button></div>' +
        '<div class="card">' + future.map((i) => '<div class="card-row"><span>' + esc(i.name) + "</span></div>").join("") + "</div></section>";
    }

    h += '<section class="section"><p class="eyebrow">Your data</p><div class="tool-list">' +
      '<button class="btn" data-act="copy-summary">Copy a summary to show a doctor</button>' +
      '<button class="btn" data-act="export">Save a backup file</button>' +
      '<button class="btn" data-act="import">Restore from a backup file</button>' +
      '<input type="file" id="import-file" accept=".json,application/json" hidden>' +
      "</div>" + statusLine() + "</section>";
    return h;
  }

  function statusLine() {
    if (!storageOk) return '<div class="status-line"><span class="dot local"></span>This device is not letting the app save. Save a backup file now.</div>';
    const lb = lastBackup();
    const age = lb ? -daysUntil(lb) : null;
    const total = KINDS.reduce((n, k) => n + Object.keys(state[k]).length, 0);
    const backupText = lb ? "Last backup " + (age === 0 ? "today" : relDays(-age).toLowerCase()) + "." : "No backup saved yet.";
    const stale = total > 0 && (age == null || age > 30);
    return '<div class="status-line"><span class="dot ' + (stale ? "local" : "on") + '"></span>Saved on this iPhone only. ' + backupText + (stale ? " Save one to Files or OneDrive." : "") + "</div>";
  }

  function viewAppointments() {
    const all = list("appointments");
    if (!all.length) return emptyState("appointments", "Keep every appointment in one place.", "Add the date, who you are seeing, and jot down questions beforehand. After the visit, record what was said and what happens next.");
    const items = apptFilter === "upcoming" ? apptsUpcoming() : apptsPast();
    let h = '<div class="filter" role="group" aria-label="Show"><button data-filter="upcoming" aria-pressed="' + (apptFilter === "upcoming") + '">Upcoming (' + apptsUpcoming().length + ')</button><button data-filter="past" aria-pressed="' + (apptFilter === "past") + '">Past (' + apptsPast().length + ")</button></div>";
    h += items.length ? items.map((a) => apptCard(a, { full: apptFilter === "past" })).join("") : '<div class="empty">' + (apptFilter === "upcoming" ? "No upcoming appointments." : "No past appointments yet.") + "</div>";
    return h;
  }

  function viewMedications() {
    const all = medsSorted();
    if (!all.length) return emptyState("medications", "Track your medications and scripts.", "Add each medication with its dose, when the script is next due to be filled, and how many repeats are left. Tap “Mark as filled today” at the pharmacy and the next due date updates itself.");
    const active = all.filter((m) => m.active !== false), stopped = all.filter((m) => m.active === false);
    let h = '<section class="section"><p class="eyebrow">Taking now (' + active.length + ")</p>" + (active.length ? active.map((m) => medCard(m)).join("") : '<div class="empty">None marked as current.</div>') + "</section>";
    if (stopped.length) h += '<section class="section"><p class="eyebrow">Stopped</p>' + stopped.map((m) => medCard(m)).join("") + "</section>";
    return h;
  }

  function viewHealth() {
    const all = list("issues");
    if (!all.length) return emptyState("issues", "Summarise your health in one list.", "Add the conditions being treated now, things you are keeping an eye on, and anything you want to raise with a doctor in the future.");
    const groups = ["current", "monitoring", "future", "resolved"];
    return groups.map((g) => {
      const items = all.filter((i) => (i.status || "current") === g).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      if (!items.length) return "";
      return '<section class="section"><p class="eyebrow">' + ISSUE_STATUS[g].label + " (" + items.length + ")</p>" + items.map((i) => issueCard(i)).join("") + "</section>";
    }).join("");
  }

  function render() {
    $("#view-title").textContent = TITLES[tab];
    const addBtn = $("#add-btn");
    addBtn.hidden = tab === "overview";
    addBtn.dataset.kind = tab === "health" ? "issues" : tab;
    document.querySelectorAll("nav.tabs button").forEach((b) => {
      if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    const html = tab === "overview" ? viewOverview() : tab === "appointments" ? viewAppointments() : tab === "medications" ? viewMedications() : viewHealth();
    $("#main").innerHTML = '<div class="view">' + html + "</div>";
  }

  function go(t) {
    tab = t;
    try { history.replaceState(null, "", "#" + t); } catch (e) { /* ignore */ }
    render();
    window.scrollTo(0, 0);
  }

  // ---------- editor sheet ----------
  function issueOptions(selected) {
    const opts = list("issues").filter((i) => i.status !== "resolved" || i.id === selected).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    return [{ v: "", t: "None" }].concat(opts.map((i) => ({ v: i.id, t: i.name })));
  }
  const FORMS = {
    appointments: () => [
      { k: "who", label: "Who are you seeing?", type: "text", req: true, ph: "Dr Patel" },
      { row: [{ k: "kind", label: "Type", type: "text", ph: "GP, specialist, test…" }, { k: "issueId", label: "Related issue", type: "select", options: issueOptions }] },
      { row: [{ k: "date", label: "Date", type: "date", req: true }, { k: "time", label: "Time", type: "time" }] },
      { k: "place", label: "Where", type: "text", ph: "Clinic or address" },
      { k: "reason", label: "Reason for visit", type: "text" },
      { k: "before", label: "Before: questions and things to mention", type: "textarea", ph: "Symptoms, questions, scripts you need…" },
      { k: "after", label: "After: what was said and next steps", type: "textarea", ph: "Results, changes to medication, referrals, follow-ups…" },
    ],
    medications: () => [
      { k: "name", label: "Medication", type: "text", req: true },
      { row: [{ k: "dose", label: "Dose", type: "text", ph: "20 mg" }, { k: "schedule", label: "When to take", type: "text", ph: "Morning and night" }] },
      { row: [{ k: "prescriber", label: "Prescribed by", type: "text" }, { k: "issueId", label: "For", type: "select", options: issueOptions }] },
      { row: [{ k: "nextDue", label: "Next fill due", type: "date" }, { k: "repeats", label: "Repeats left", type: "number" }] },
      { row: [{ k: "supplyDays", label: "Days each fill lasts", type: "number", hint: "Used to work out the next due date" }, { k: "lastFilled", label: "Last filled", type: "date" }] },
      { k: "notes", label: "Notes", type: "textarea", ph: "Pharmacy, side effects, with food…" },
      { k: "active", label: "I'm currently taking this", type: "check", dflt: true },
    ],
    issues: () => [
      { k: "name", label: "Health issue", type: "text", req: true },
      { k: "status", label: "Status", type: "select", options: () => Object.entries(ISSUE_STATUS).map(([v, s]) => ({ v, t: s.label })) },
      { row: [{ k: "treatedBy", label: "Treated by", type: "text" }, { k: "since", label: "Since", type: "text", ph: "2023, or a date" }] },
      { k: "notes", label: "Notes", type: "textarea", ph: "Plan, test results, what to ask next time…" },
    ],
  };
  const NOUN = { appointments: "appointment", medications: "medication", issues: "health issue" };

  function fieldHTML(f, data) {
    const id = "f-" + f.k;
    const val = data[f.k] != null ? data[f.k] : (f.dflt != null ? f.dflt : "");
    if (f.type === "check") return '<label class="check"><input type="checkbox" id="' + id + '"' + (val ? " checked" : "") + "> " + esc(f.label) + "</label>";
    let input;
    if (f.type === "textarea") input = '<textarea id="' + id + '" placeholder="' + esc(f.ph || "") + '">' + esc(val) + "</textarea>";
    else if (f.type === "select") input = '<select id="' + id + '">' + f.options(val).map((o) => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(val) ? " selected" : "") + ">" + esc(o.t) + "</option>").join("") + "</select>";
    else input = '<input id="' + id + '" type="' + f.type + '"' + (f.type === "number" ? ' inputmode="numeric" min="0"' : "") + ' value="' + esc(val) + '" placeholder="' + esc(f.ph || "") + '"' + (f.req ? " required" : "") + ">";
    return '<div class="field"><label for="' + id + '">' + esc(f.label) + "</label>" + input + (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + "</div>";
  }
  const flatFields = (spec) => spec.reduce((acc, f) => acc.concat(f.row || [f]), []);

  function openEditor(kind, id, focusKey) {
    const existing = id ? state[kind][id] : null;
    const data = Object.assign({}, existing || {});
    if (!existing && kind === "appointments") data.date = "";
    if (!existing && kind === "issues") data.status = "current";
    const spec = FORMS[kind]();
    deleteArmed = false;
    $("#sheet-root").innerHTML = '<div class="sheet-back" id="sheet-back"><form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>' +
      '<div class="sheet-head"><h2 id="sheet-title">' + (existing ? "Edit " : "New ") + NOUN[kind] + '</h2><button type="button" class="btn" data-act="close">Cancel</button></div>' +
      spec.map((f) => f.row ? '<div class="field-row">' + f.row.map((r) => fieldHTML(r, data)).join("") + "</div>" : fieldHTML(f, data)).join("") +
      '<div class="sheet-actions">' + (existing ? '<button type="button" class="btn danger" id="del-btn" data-act="delete">Delete</button>' : "<span></span>") + '<button type="submit" class="btn primary">Save</button></div>' +
      "</form></div>";
    const sheet = $("#sheet");
    sheet.addEventListener("submit", (e) => {
      e.preventDefault();
      const out = Object.assign({}, existing || {});
      for (const f of flatFields(spec)) {
        const el = $("#f-" + f.k);
        if (f.type === "check") out[f.k] = el.checked;
        else if (f.type === "number") out[f.k] = el.value === "" ? "" : Math.max(0, Math.round(Number(el.value)));
        else out[f.k] = el.value.trim();
        if (f.req && !out[f.k]) { el.focus(); toast("Please fill in “" + f.label + "”."); return; }
      }
      if (kind === "medications" && !out.nextDue && out.lastFilled && out.supplyDays) out.nextDue = addDays(out.lastFilled, Number(out.supplyDays));
      delete out.id;
      saveItem(kind, id || newId(), out);
      closeEditor();
      toast(existing ? "Saved" : "Added");
    });
    sheet.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      if (b.dataset.act === "close") closeEditor();
      if (b.dataset.act === "delete") {
        if (!deleteArmed) { deleteArmed = true; b.textContent = "Tap again to delete"; return; }
        removeItem(kind, id); closeEditor(); toast("Deleted");
      }
    });
    $("#sheet-back").addEventListener("click", (e) => { if (e.target.id === "sheet-back") closeEditor(); });
    const f = focusKey && $("#f-" + focusKey);
    if (f) { f.scrollIntoView({ block: "center" }); f.focus(); }
  }
  function closeEditor() { $("#sheet-root").innerHTML = ""; }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheet")) closeEditor(); });

  function markRefilled(id) {
    const m = Object.assign({}, state.medications[id]);
    if (!m.supplyDays) { toast("Add how many days each fill lasts, then I can work out the next date."); openEditor("medications", id, "supplyDays"); return; }
    const t = todayISO();
    m.lastFilled = t;
    m.nextDue = addDays(t, Number(m.supplyDays));
    const r = repeatsLeft(m);
    if (r != null) m.repeats = Math.max(0, r - 1);
    saveItem("medications", id, m);
    toast("Next fill due " + fmtDate(m.nextDue, { day: "numeric", month: "short" }));
  }

  // ---------- summary, backup, restore ----------
  function summaryText() {
    const lines = ["HEALTH SUMMARY (" + fmtDate(todayISO(), { day: "numeric", month: "long", year: "numeric" }) + ")", ""];
    const meds = list("medications").filter((m) => m.active !== false).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    lines.push("Current medications:");
    lines.push(...(meds.length ? meds.map((m) => "- " + [m.name, m.dose, m.schedule].filter(Boolean).join(", ") + (m.prescriber ? " (prescribed by " + m.prescriber + ")" : "")) : ["- None recorded"]));
    lines.push("");
    const groups = [["current", "Being treated"], ["monitoring", "Monitoring"], ["future", "To raise"]];
    groups.forEach(([g, label]) => {
      const items = list("issues").filter((i) => (i.status || "current") === g);
      if (items.length) { lines.push(label + ":"); items.forEach((i) => lines.push("- " + i.name + (i.treatedBy ? " (" + i.treatedBy + ")" : ""))); lines.push(""); }
    });
    const up = apptsUpcoming().slice(0, 5);
    if (up.length) { lines.push("Upcoming appointments:"); up.forEach((a) => lines.push("- " + fmtDate(a.date) + (a.time ? " " + fmtTime(a.time) : "") + ": " + (a.who || "") + (a.kind ? " (" + a.kind + ")" : ""))); }
    return lines.join("\n").trim();
  }
  async function copySummary() {
    const text = summaryText();
    try { await navigator.clipboard.writeText(text); toast("Summary copied. Paste it into a message or note."); }
    catch (e) {
      $("#sheet-root").innerHTML = '<div class="sheet-back" id="sheet-back"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sum-title"><div class="sheet-head"><h2 id="sum-title">Summary</h2><button type="button" class="btn" id="sum-close">Done</button></div><div class="field"><label for="sum-text">Select all and copy</label><textarea id="sum-text" rows="14" readonly>' + esc(text) + "</textarea></div></div></div>";
      $("#sum-close").addEventListener("click", closeEditor);
      const ta = $("#sum-text"); ta.focus(); ta.select();
    }
  }
  async function exportBackup() {
    const payload = JSON.stringify({ app: "health-binder", version: 1, exported: new Date().toISOString(), data: state }, null, 2);
    const name = "health-binder-backup-" + todayISO() + ".json";
    const file = new File([payload], name, { type: "application/json" });
    // On iPhone this opens the share sheet: choose "Save to Files" (or OneDrive).
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Health Binder backup" }); setLastBackup(); render(); toast("Backup saved"); }
      catch (e) { if (!e || e.name !== "AbortError") toast("Couldn't open the share sheet. Try again."); }
      return;
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setLastBackup(); render(); toast("Backup downloaded");
  }
  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch (e) { toast("That file isn't a Health Binder backup."); return; }
      const data = parsed && parsed.app === "health-binder" && parsed.data;
      if (!data) { toast("That file isn't a Health Binder backup."); return; }
      let n = 0;
      for (const kind of KINDS) {
        for (const [id, item] of Object.entries(data[kind] || {})) {
          if (item && typeof item === "object") { state[kind] = Object.assign({}, state[kind], { [id]: Object.assign({}, item) }); n++; }
        }
      }
      lsWrite();
      render();
      toast("Restored " + n + (n === 1 ? " entry" : " entries"));
    };
    reader.readAsText(file);
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    if (e.target.closest("#sheet-root")) return;
    const t = e.target.closest("[data-tab]");
    if (t) { go(t.dataset.tab); return; }
    const g = e.target.closest("[data-go]");
    if (g) { go(g.dataset.go); return; }
    const f = e.target.closest("[data-filter]");
    if (f) { apptFilter = f.dataset.filter; render(); return; }
    if (e.target.closest("#add-btn")) { openEditor($("#add-btn").dataset.kind); return; }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    if (act === "new") openEditor(b.dataset.kind);
    else if (act === "edit") openEditor(b.dataset.kind, b.dataset.id, b.dataset.focus);
    else if (act === "refilled") markRefilled(b.dataset.id);
    else if (act === "copy-summary") copySummary();
    else if (act === "export") exportBackup();
    else if (act === "import") { const inp = $("#import-file"); if (inp) inp.click(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; }
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) go(h); });

  // ---------- start ----------
  const saved = lsRead();
  if (saved) KINDS.forEach((k) => { state[k] = saved[k] || {}; });
  render();
  // Ask iOS to keep this app's storage even when the phone is low on space.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
